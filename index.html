<!doctype html>
<html lang="en">
  <head>
    <title>E-commerceProducts</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="./style.css" rel="stylesheet" />
    <!-- tailwind csss and daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awsome link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="w-[1200px] mx-auto">
      <div class="navbar">
        <div class="navbar-start">
          <div class="dropdown">
            <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
              <svg
                aria-label="Menu"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h8m-8 6h16"
                />
              </svg>
            </div>
            <ul
              tabindex="-1"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow text-xl"
            >
              <li><a>Home</a></li>

              <li><a>Products</a></li>
              <li><a>Aboaut</a></li>
              <li><a>Contact</a></li>
            </ul>
          </div>
          <a class="text-xl text-blue-500 font-bold">SwiftCart</a>
        </div>
        <div class="navbar-center hidden lg:flex">
          <ul class="menu menu-horizontal px-1 text-xl">
            <li><a>Home</a></li>

            <li><a>Products</a></li>
            <li><a>Aboaut</a></li>
            <li><a>Contact</a></li>
          </ul>
        </div>
        <div class="navbar-end">
          <a class=""
            ><i class="fa-solid fa-cart-shopping text-gray-400 text-2xl"></i
          ></a>
        </div>
      </div>
    </nav>
    <!-- banner section -->
    <section>
      <div
        class="hero min-h-[500px]"
        style="background-image: url(./Assets/banner-image.png)"
      >
        <div class="hero-overlay"></div>
        <div class="text-white mr-[650px]">
          <div class="">
            <h1 class="mb-5 text-5xl font-bold">Best Collection For You</h1>
            <p class="mb-5">
              Discover the lattest trends in fassion, electronics and more. Shop
              with <br />
              confidance and style SwiftCart
            </p>
            <button class="btn btn-primary">Shop Now</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
